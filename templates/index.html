<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visa Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-light">
        <div class="container-fluid">
            <span class="navbar-brand mx-auto">🎯 Visa Prediction System</span>
        </div>
    </nav>

    <div class="main-container">
        <div class="form-card">
            <form action="/" method="post">
                <legend>Visa Approval Application</legend>
                
                <!-- Personal Information -->
                <div class="section-title">📋 Personal Information</div>
                
                <div class="mb-3">
                    <label for="continent">Continent</label>
                    <select class="form-control" id="continent" name="continent" required>
                        <option value="" disabled selected>Select Your Continent</option>
                        <option value="Asia">🌏 Asia</option>
                        <option value="Africa">🌍 Africa</option>
                        <option value="North America">🌎 North America</option>
                        <option value="Europe">🌍 Europe</option>
                        <option value="South America">🌎 South America</option>
                        <option value="Oceania">🌏 Oceania</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="education_of_employee">Education Level</label>
                    <select class="form-control" id="education_of_employee" name="education_of_employee" required>
                        <option value="" disabled selected>Select Your Education</option>
                        <option value="High School">🎓 High School</option>
                        <option value="Bachelor's">🎓 Bachelor's Degree</option>
                        <option value="Master's">🎓 Master's Degree</option>
                        <option value="Doctorate">🎓 Doctorate</option>
                    </select>
                </div>

                <!-- Employment Details -->
                <div class="section-divider">
                    <div class="section-title">💼 Employment Details</div>
                </div>

                <div class="mb-3">
                    <label for="has_job_experience">Previous Job Experience</label>
                    <select class="form-control" id="has_job_experience" name="has_job_experience" required>
                        <option value="" disabled selected>Do you have experience?</option>
                        <option value="Y">✅ Yes</option>
                        <option value="N">❌ No</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="requires_job_training">Requires Job Training</label>
                    <select class="form-control" id="requires_job_training" name="requires_job_training" required>
                        <option value="" disabled selected>Training Required?</option>
                        <option value="Y">✅ Yes</option>
                        <option value="N">❌ No</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="full_time_position">Employment Type</label>
                    <select class="form-control" id="full_time_position" name="full_time_position" required>
                        <option value="" disabled selected>Full or Part Time?</option>
                        <option value="Y">⏰ Full Time</option>
                        <option value="N">⏱️ Part Time</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="region_of_employment">Employment Region</label>
                    <select class="form-control" id="region_of_employment" name="region_of_employment" required>
                        <option value="" disabled selected>Select Region</option>
                        <option value="West">🌄 West</option>
                        <option value="Northeast">🏙️ Northeast</option>
                        <option value="South">☀️ South</option>
                        <option value="Midwest">🌾 Midwest</option>
                        <option value="Island">🏝️ Island</option>
                    </select>
                </div>

                <!-- Company Information -->
                <div class="section-divider">
                    <div class="section-title">🏢 Company Information</div>
                </div>

                <div class="mb-3">
                    <label for="no_of_employees">Number of Employees</label>
                    <input type="number" class="form-control" id="no_of_employees" name="no_of_employees" 
                           min="14500" max="40000" placeholder="Enter employee count" required>
                    <div class="input-hint">Range: 14,500 - 40,000 employees</div>
                </div>

                <div class="mb-3">
                    <label for="company_age">Company Age (Years)</label>
                    <input type="number" class="form-control" id="company_age" name="company_age" 
                           min="15" max="180" placeholder="Enter company age" required>
                    <div class="input-hint">Range: 15 - 180 years</div>
                </div>

                <!-- Compensation -->
                <div class="section-divider">
                    <div class="section-title">💰 Compensation Details</div>
                </div>

                <div class="mb-3">
                    <label for="prevailing_wage">Prevailing Wage ($)</label>
                    <input type="number" class="form-control" id="prevailing_wage" name="prevailing_wage" 
                           min="600" max="70000" placeholder="Enter wage amount" required>
                    <div class="input-hint">Range: $600 - $70,000</div>
                </div>

                <div class="mb-3">
                    <label for="unit_of_wage">Contract Tenure</label>
                    <select class="form-control" id="unit_of_wage" name="unit_of_wage" required>
                        <option value="" disabled selected>Select Pay Period</option>
                        <option value="Hour">⏰ Hourly</option>
                        <option value="Week">📅 Weekly</option>
                        <option value="Month">📆 Monthly</option>
                        <option value="Year">🗓️ Yearly</option>
                    </select>
                </div>

                <button class="btn btn-primary" type="submit">🔍 Predict Visa Status</button>
            </form>
        </div>

        <!-- Result Display -->
        {% if context %}
        <div class="result-container">
            <h2>Prediction Result</h2>
            <div class="result-status">{{ context }}</div>
        </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
